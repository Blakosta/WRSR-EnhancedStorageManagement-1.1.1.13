name: Build Windows DLL

on:
  push:
    branches:
      - adaptation/1.1.1.13
      - adaptation/1.2.0.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Checkout exact 1.2.0.8 reference binaries
        uses: actions/checkout@v4
        with:
          repository: Blakosta/WRSR-EfficientLogistics1.2.0.8.
          ref: main
          path: reference-binaries
      - name: Verify reference binary identity
        shell: pwsh
        run: |
          $expected = @{
            "SOVIET64.exe" = "91a2ff66fd02e02a51f38f4d2106ccb56af9510af9a6fb7e7b93ae4249358ea7"
            "C3DDLL64.dll" = "331895c798092c1c24d8d7586631d8c514bcb0070dcb0d189eca7cf29ba8a483"
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path "reference-binaries" $name
            if (!(Test-Path $path)) { throw "Missing reference binary: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$name]) {
              throw "$name SHA-256 mismatch: expected $($expected[$name]), got $actual"
            }
            Write-Host "$name SHA-256 OK: $actual"
          }
      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
      - name: Build and verify release package
        shell: cmd
        run: Source\build_release.bat "%GITHUB_WORKSPACE%\out"
      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: EnhancedStorageManagement-WRSR-1.2.0.8-candidate
          path: out/runtime
          if-no-files-found: error
