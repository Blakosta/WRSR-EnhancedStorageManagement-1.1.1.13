name: Build Windows DLL

on:
  push:
    branches:
      - adaptation/1.1.1.13
      - adaptation/1.2.0.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      # The exact reference binaries are held in a separate private repository.
      # GitHub Actions' repository-scoped token cannot clone that private repo;
      # binary-specific analysis must be performed in the connected GitHub workspace.
      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --yes --no-progress
      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
      - name: Build and verify release package
        shell: cmd
        run: Source\build_release.bat "%GITHUB_WORKSPACE%\out"
      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: EnhancedStorageManagement-WRSR-1.2.0.8-candidate
          path: out/runtime
          if-no-files-found: error
