[StorageManagement]
##NOTE Maximum 2D edge-to-edge gap, in metres, for a supported storage-management link.
##NOTE The check uses WRSR's rotated native building footprints rather than centre distance.
LinkGapMeters=5

##NOTE Show placement feedback when the building being placed can form a supported link.
##NOTE A compatible completed building is highlighted green when the native render path is available;
##NOTE the compatible existing building is highlighted using WRSR's native whole-building green renderer.
ShowPlacementOverlay=1

# Supported relationship graph:
#   STORAGE <-> RESOURCE / PRODUCTION BUILDING     allowed
#   FREIGHT DELIVERY <-> STORAGE                  allowed
#   FREIGHT DELIVERY <-> RESOURCE / PRODUCTION    allowed
#   STORAGE <-> STORAGE                           not propagated
#   FREIGHT DELIVERY <-> FREIGHT DELIVERY         not propagated
#   RESOURCE / PRODUCTION <-> RESOURCE / PRODUCTION not propagated
#
# Freight stations/loaders are access points, not extra storage capacity. Compatible
# factory/storage pools can be filled or drained through supported native logistics
# paths while the original WRSR storage allocation settings remain authoritative.
